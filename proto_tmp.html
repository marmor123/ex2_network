<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Answers wayfinder ticket #22: does the two-line tour
  shell feel right? Three variants of the shell (bubble placement, tour-line
  form, entry feel, highlight treatment), switchable via ?variant=A|B|C,
  sharing four sample stations drafted in the light-skeleton voice (what /
  how / why, watch-outs, cross-links, one predict-then-confirm). Nothing here
  ships: the build ticket reimplements whatever gets approved.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — bw.c two-line tour shell (ticket #22)</title>
<style>
  :root {
    --bg: #0b1220;
    --bg2: #0f172a;
    --line: #1e293b;
    --ink: #dbe4f0;
    --dim: #64748b;
    --gutter: #4b5a72;
    --accent: #38bdf8;
    --warn: #fbbf24;
    --ok: #34d399;
    --pink: #f472b6;
    --violet: #c4b5fd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #layout { position: relative; height: 100vh; }
  #file-line {
    font-family: Consolas, "Cascadia Mono", Menlo, monospace;
    font-size: 13.5px; line-height: 1.62; overflow: auto;
  }
  .fl-line { display: flex; }
  .fl-g {
    flex-shrink: 0; width: 4.2em; text-align: right; padding-right: 1.1em;
    color: var(--gutter); user-select: none; position: sticky; left: 0;
    background: var(--bg);
  }
  .fl-c { white-space: pre; flex: 1; padding-right: 10px; }
  .tk.kw  { color: #7dd3fc; }
  .tk.type{ color: #a5b4fc; }
  .tk.num { color: var(--warn); }
  .tk.str { color: #86efac; }
  .tk.com { color: #556580; font-style: italic; }
  .tk.pp  { color: var(--violet); }

  /* ---- three-state highlight (shared rules; treatment varies) ---- */
  .st-open > .fl-c   { background: rgba(56,189,248,.14); box-shadow: inset 2px 0 0 var(--accent); }
  .st-open > .fl-g   { color: #7dd3fc; }
  .st-preview > .fl-c{ background: rgba(148,163,184,.13); }
  .st-cur > .fl-g    { color: var(--warn); font-weight: 600; }
  .st-cur.st-open > .fl-g { color: #7dd3fc; }

  /* ================= VARIANT A — Rail ================= */
  body[data-variant="A"] #layout { display: flex; flex-direction: column; }
  body[data-variant="A"] .row { display: flex; flex: 1; min-height: 0; }
  body[data-variant="A"] #file-line { flex: 1; }
  body[data-variant="A"] #rail {
    width: 400px; flex-shrink: 0; border-left: 1px solid var(--line);
    background: var(--bg2); overflow-y: auto;
  }
  body[data-variant="A"] #tourA {
    height: 54px; border-top: 1px solid var(--line); display: flex;
    align-items: center; gap: 10px; padding: 0 14px; background: var(--bg2);
  }
  .chip {
    border: 1px solid #334155; border-radius: 999px; padding: 4px 12px;
    font-size: 12.5px; color: #aab8cc; cursor: pointer; background: transparent;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: #e0f2fe; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #06283f; font-weight: 600; }
  .chip.cur:not(.on) { border-color: var(--warn); color: var(--warn); }
  .chip .no { font-weight: 700; margin-right: 6px; opacity: .8; }
  #startBtn {
    background: var(--accent); color: #06283f; border: none; border-radius: 999px;
    padding: 7px 16px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  #nextHint { margin-left: auto; font-size: 12px; color: var(--dim); white-space: nowrap; }
  #nextHint b { color: var(--accent); }

  /* bubble content (shared by A rail, B card, C sheet) */
  .bubble { padding: 18px 20px; }
  .bubble h2 { margin: 0 0 2px; font-size: 17px; }
  .b-sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .b-sub .tag {
    display: inline-block; border: 1px solid #334155; border-radius: 4px;
    padding: 1px 7px; margin-right: 6px; font-size: 11px; color: #93a5bd;
  }
  .b-sub .typ { text-transform: uppercase; letter-spacing: .08em; color: var(--violet); margin-right: 8px; }
  .bubble p { font-size: 13.5px; line-height: 1.55; margin: 0 0 10px; color: #c8d4e4; }
  .bubble p strong { color: var(--ink); }
  .b-lead { color: #e8f1fb; font-size: 14px !important; font-weight: 600; }
  .b-watch {
    border-left: 3px solid var(--warn); background: rgba(251,191,36,.07);
    padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 0 0 10px; font-size: 13px;
    color: #e7d5a8; line-height: 1.5;
  }
  .b-pred { border: 1px dashed #475569; border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; }
  .b-pred .q { font-size: 13px; color: #a5b4fc; margin: 0 0 6px; }
  .b-pred .a { font-size: 13px; color: #dbe4f0; margin: 8px 0 0; }
  .b-pred button {
    background: #334155; color: #e0f2fe; border: none; border-radius: 6px;
    padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .hidden { display: none; }
  .b-x { margin-top: 4px; }
  .b-x span { font-size: 11px; color: var(--dim); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .07em; }
  .xchip {
    display: inline-block; border: 1px solid #334155; background: #16213a;
    border-radius: 6px; padding: 2px 8px; font-size: 11.5px; color: #93c5fd;
    margin: 0 6px 6px 0; font-family: Consolas, monospace;
  }
  .b-diag { margin: 4px 0 12px; }
  .b-diag svg { width: 100%; height: auto; display: block; }
  .b-diag figcaption { font-size: 11.5px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .b-nav { display: flex; gap: 8px; margin-top: 14px; }
  .b-nav button {
    flex: 1; padding: 7px; border-radius: 8px; border: 1px solid #334155;
    background: #16213a; color: #dbe4f0; font-size: 13px; cursor: pointer;
  }
  .b-nav button:hover { border-color: var(--accent); }
  .b-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; }
  .b-placeholder { padding: 22px; color: var(--dim); font-size: 13.5px; line-height: 1.6; }
  .b-placeholder h3 { color: #aab8cc; font-size: 14px; margin: 0 0 8px; }
  .b-placeholder .slist { margin-top: 14px; }
  .b-placeholder .sitem { padding: 8px 0; border-top: 1px solid #1e293b; cursor: pointer; }
  .b-placeholder .sitem:hover { color: #e0f2fe; }
  .b-placeholder .sitem b { font-size: 12.5px; }
  .b-placeholder .sitem .meta { font-size: 11px; color: var(--dim); }

  /* ================= VARIANT B — Float ================= */
  body[data-variant="B"] #file-line { height: 100%; padding-right: 34px; }
  body[data-variant="B"] #rail, body[data-variant="B"] #tourA,
  body[data-variant="B"] #stepperC, body[data-variant="B"] #sheet,
  body[data-variant="B"] #overlayC { display: none; }
  #minimap {
    position: fixed; right: 6px; top: 50%; transform: translateY(-50%);
    width: 12px; z-index: 40; display: none;
  }
  body[data-variant="B"] #minimap { display: flex; flex-direction: column; gap: 2px; }
  #minimap .track { flex: 1; width: 4px; background: #22304a; border-radius: 2px; position: relative; }
  #minimap .tick {
    position: absolute; left: 50%; width: 8px; height: 8px; border-radius: 2px;
    transform: translate(-50%, -50%); background: #64748b; cursor: pointer; transition: height .12s;
  }
  #minimap .tick.s1 { background: var(--ok); }
  #minimap .tick.s2 { background: var(--violet); }
  #minimap .tick.s3 { background: var(--accent); }
  #minimap .tick.s4 { background: var(--warn); }
  #minimap .tick.cur { height: 14px; border: 1px solid #fff; }
  #minimap .tick:hover { transform: translate(-50%,-50%) scale(1.4); }
  #beginBtn {
    position: fixed; right: 28px; bottom: 28px; z-index: 40; display: none;
    background: var(--accent); color: #06283f; border: none; border-radius: 999px;
    padding: 11px 20px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(56,189,248,.35);
  }
  body[data-variant="B"] #beginBtn { display: block; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 8px 24px rgba(56,189,248,.25); } 50% { box-shadow: 0 8px 34px rgba(56,189,248,.6); } }
  body[data-variant="B"] .fl-line.dim .fl-c { opacity: .3; }
  body[data-variant="B"] .fl-line.dim .fl-g { opacity: .45; }
  body[data-variant="B"] .st-preview > .fl-c { background: transparent; text-decoration: underline; text-decoration-color: #64748b; }
  #bubbleB {
    position: fixed; width: 350px; background: var(--bg2); border: 1px solid #334155;
    border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.55); z-index: 60;
    display: none; max-height: 70vh; overflow-y: auto;
  }
  #bubbleB .bubble { position: relative; }

  /* ================= VARIANT C — Deck ================= */
  body[data-variant="C"] #file-line { height: 100%; padding-bottom: 120px; }
  body[data-variant="C"] #rail, body[data-variant="C"] #tourA,
  body[data-variant="C"] #minimap, body[data-variant="C"] #bubbleB,
  body[data-variant="C"] #beginBtn { display: none; }
  body[data-variant="C"] #file-line { max-width: 1000px; margin: 0 auto; }
  body[data-variant="C"] .fl-line.st-start .fl-g::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: 2px;

  body[data-variant="C"] .fl-line.st-start .fl-g { color: #c8d4e4; }
  body[data-variant="C"] .st-cur > .fl-c { box-shadow: inset 2px 0 0 var(--warn); }
  #stepperC {
    position: fixed; left: 0; right: 0; bottom: 0; height: 58px; z-index: 40;
    background: var(--bg2); border-top: 1px solid var(--line); display: none;
    align-items: center; justify-content: center; gap: 0;
  }
  body[data-variant="C"] #stepperC { display: flex; }
  .step { display: flex; align-items: center; cursor: pointer; }
  .step .dot {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid #334155;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    font-weight: 700; color: #93a5bd; background: #16213a;
  }
  .step.on .dot { background: var(--accent); border-color: var(--accent); color: #06283f; }
  .step .lab { font-size: 12px; color: #93a5bd; margin-left: 8px; margin-right: 4px; white-space: nowrap; }
  .step.on .lab { color: #e0f2fe; }
  .step .conn { width: 44px; height: 2px; background: #334155; margin: 0 6px; }
  .step.on .conn, .step.done .conn { background: var(--accent); }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 58px; height: 300px; z-index: 35;
    background: var(--bg2); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    transform: translateY(100%); transition: transform .22s ease; display: none;
  }
  body[data-variant="C"] #sheet { display: block; }
  body[data-variant="C"] #sheet.open { transform: translateY(0); }
  #sheet .bubble { position: relative; height: 100%; overflow-y: auto; }
  #overlayC {
    position: fixed; inset: 0; z-index: 70; display: none;
    background: rgba(4, 10, 20, .78); backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
  }
  body[data-variant="C"] #overlayC { display: flex; }
  body[data-variant="C"] #overlayC.hidden { display: none; }
  .oc-card {
    width: 460px; background: var(--bg2); border: 1px solid #334155; border-radius: 16px;
    padding: 26px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .oc-card h1 { margin: 0 0 6px; font-size: 20px; }
  .oc-card .pitch { color: #aab8cc; font-size: 13.5px; line-height: 1.6; margin: 0 0 16px; }
  .oc-card ul { list-style: none; padding: 0; margin: 0 0 18px; }
  .oc-card li {
    display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-top: 1px solid #1e293b; font-size: 13.5px; color: #c8d4e4;
  }
  .oc-card li .no {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid #334155;
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    color: var(--accent); flex-shrink: 0;
  }
  .oc-card li .meta { color: var(--dim); font-size: 11.5px; margin-left: auto; }
  .oc-card button {
    width: 100%; background: var(--accent); color: #06283f; border: none;
    border-radius: 10px; padding: 11px; font-weight: 700; font-size: 14px; cursor: pointer;
  }

  /* ================= prototype switcher ================= */
  #switcher {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 4px;
    background: #1c2a45; border: 1px solid #334a6b; border-radius: 999px;
    padding: 4px 6px; box-shadow: 0 6px 20px rgba(0,0,0,.5);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #switcher button {
    background: none; border: none; color: #93c5fd; font-size: 17px; cursor: pointer;
    padding: 2px 9px; border-radius: 999px; line-height: 1;
  }
  #switcher button:hover { background: #25375a; color: #fff; }
  #switcher .lab { font-size: 12px; color: #aab8cc; padding: 0 8px; white-space: nowrap; }
  #switcher .lab b { color: #e0f2fe; }
  #switcher .hint { font-size: 10.5px; color: #5b7395; padding-left: 6px; }
</style>

/*
 * Lab #2 — Verbs throughput benchmark (single source, server and client
 * roles decided by argv: no hostname argument = server, hostname = client).
 *
 * Stage 5 (T5): the streaming data path (ADR-0002) replacing the naive
 * one. The client runs the 21-size sweep (1 B..1 MB, powers of two) with
 * ex1's converged counts table. Per size a warmup batch rides the same
 * windowed stream ahead of the timed batch, then the timed batch of RDMA
 * WRITEs: K WRs posted per ibv_post_send as a linked list (W=256, K=64
 * by default), only the K-th WR of the stream signaled — one CQE per K
 * WRs, so completions are accounted in exact multiples of K (RC in-order)
 * — reclaimed only while the window is full (refill-never-empty, the SQ
 * never empties), and messages ≤ max_inline_data sent with IBV_SEND_INLINE.
 * The clock (CLOCK_MONOTONIC) starts at the first timed post and stops at
 * the ack-receive completion (ADR-0003); each size prints an ex1-identical
 * "size\t%.2f\tunit" line with auto-scaled bps→Gbps units. The server's
 * only data-path role is absorbing the WRITEs into its registered buffer;
 * it just acks each done.
 *
 * The control protocol (T3): per size one done SEND (client, signaled)
 * and one ack SEND (server, 8-byte inline carrying the sequence counter),
 * both riding the data QP (ADR-0001) over the 32-deep control receive
 * pool posted at init, never refreshed.
 *
 * Device init and handshake: the two 1 MB buffer registrations (the
 * server's with remote-write permission); QP create → init → RTR → RTS
 * with the port's active MTU; the TCP exchange of LID/QPN/PSN/GID plus
 * the server's buffer addr/rkey.
 *
 * Adapted from the assignment's bw_template.c: the socket exchange is the
 * template's, extended with the server's buffer address and rkey; the QP
 * lifecycle (INIT/RTR/RTS, rnr_retry/retry_cnt, access flags) is the
 * template's.
 */

/* asprintf and the srand48/lrand48 family are GNU/SVID extensions: newer
 * glibc exposes them by default, the course nodes' older glibc only with
 * _GNU_SOURCE. Must precede every system header. */
#define _GNU_SOURCE

#include <assert.h>
#include <errno.h>
#include <stdio.h>
#include <stdlib.h>
#include <unistd.h>
#include <string.h>
#include <sys/types.h>
#include <sys/socket.h>
#include <sys/param.h>
#include <sys/time.h>
#include <getopt.h>
#include <arpa/inet.h>
#include <netdb.h>
#include <time.h>
#include <inttypes.h>

#include <infiniband/verbs.h>

/* One 1 MB buffer per side, registered once and never modified after init,
 * so there is no buffer-reuse hazard at full window depth (ADR-0002). */
#define BUFFER_SIZE (1u << 20)

/* Control receive pool (ADR-0001): 32 receives per side, posted once at
 * init, all pointing at one control area, never refreshed. Covers the 21
 * per-direction control messages of a full sweep. */
#define CTRL_POOL_DEPTH 32
#define CTRL_MSG_LEN 64

/* The number of control exchanges per direction: one done/ack pair per
 * size of the sweep (2^0..2^20), which also proves the 32-deep control
 * receive pool covers a full sweep. */
#define SWEEP_SIZES 21

/* The ex1 converged counts table, verbatim: one entry per size of the
 * sweep (2^0..2^20). MSG_COUNTS from ex1's convergence experiments
 * (throughput variance < 1% between doubled counts); WARMUP_COUNTS from
 * ex1's warmup probe. */
static const uint64_t MSG_COUNTS[SWEEP_SIZES] = {
        1310720, 81920, 655360, 163840, 327680, /* 1B 2B 4B 8B 16B */
        20480, 81920, 81920, 40960, 20480,      /* 32B 64B 128B 256B 512B */
        20480, 20480, 20480, 2560, 2560,        /* 1KB 2KB 4KB 8KB 16KB */
        2560, 640, 320, 160, 160,               /* 32KB 64KB 128KB 256KB 512KB */
        80                                       /* 1MB */
};

static const uint64_t WARMUP_COUNTS[SWEEP_SIZES] = {
        16, 4, 4, 32, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4
};

/* Control messages: 8 bytes each — a fixed tag plus the sequence counter
 * (the size index 0..20). The ack carries the received done verbatim, so
 * a tag or sequence mismatch means the exchange desynchronized. */
#define BW_CTRL_TAG 0x4354524cu
struct bw_ctrl_msg {
    uint32_t tag;
    uint32_t seq;
};

/* The control message must always fit one inline send. */
typedef char bw_ctrl_msg_size[(sizeof (struct bw_ctrl_msg) == 8) ? 1 : -1];

/* A control wait (the done on the server, the ack on the client, the
 * ack-send on the server) has a deadline: the peer may have died, and a
 * hung busy poll would tie up a course node until the verify script's
 * own timeout fires. */
#define CTRL_POLL_TIMEOUT_SEC 10

/* The SQ depth is the window (W) plus slack: the slack absorbs the last
 * K-WR list's overshoot of the window (K ≤ QP_SLACK, so the refill leaves
 * at most W - 1 + K ≤ sq_depth - 1 WRs outstanding) plus the per-size
 * done SEND, so neither the last data list nor the done can find the SQ
 * full. K is bounded by QP_SLACK for the same reason. */
#define QP_SLACK 1024

#define WINDOW_DEFAULT 256
#define SIGNAL_INTERVAL_DEFAULT 64

/* The largest max_inline_data tried at QP creation. mlx4 — the course
 * hardware — rejects QP creation when the declared value exceeds what its
 * WQEs can carry, and no portable query exposes that ceiling on every
 * stack, so the declaration is stepped down (bw_init_ctx) until creation
 * succeeds. The value the QP was actually created with is read back via
 * ibv_query_qp; that read-back is the runtime max_inline_data the data
 * path uses. */
#define MAX_INLINE_DATA_DECLARE 1024

/* Fixed-size handshake message, both directions. The client's message
 * carries only the first four fields (addr/rkey are the server's to give). */
#define DEST_MSG_LEN 128

/* The handshake's wire format, kept in one place so the send and parse
 * sides cannot drift: lid:qpn:psn:gid, plus :addr:rkey on the server. */
#define DEST_FMT         "%04x:%06x:%06x:%s"
#define DEST_FMT_SERVER  DEST_FMT ":%" PRIx64 ":%x"
#define DEST_FMT_PARSE   "%x:%x:%x:%32[0-9a-fA-F]:%" SCNx64 ":%x"

enum {
    /* Control receive: the done on the server, the ack on the client. All
     * 32 receives of the control receive pool share one wr_id — they all
     * point at the same control area, so which receive completed never
     * matters. */
    BW_RECV_WRID = 1,
    /* The client's done SEND, always signaled. */
    BW_SEND_DONE_WRID,
    /* The server's ack SEND, always signaled so the server consumes its
     * completion before exiting. */
    BW_SEND_ACK_WRID,
    /* Data WRITEs; one shared wr_id keeps their completions
     * distinguishable from the control messages. */
    BW_DATA_WRID,
};

static int page_size;

struct bw_context {
    struct ibv_context		*context;
    struct ibv_pd		*pd;
    struct ibv_mr		*mr;      /* the 1 MB buffer */
    struct ibv_mr		*ctrl_mr; /* the control receive area */
    struct ibv_cq		*cq;
    struct ibv_qp		*qp;
    void			*buf;     /* the 1 MB buffer */
    void			*ctrl_buf;/* the control receive area */
    uint32_t		 max_inline_data; /* the QP's negotiated max_inline_data */
    uint32_t		 sq_depth;      /* the QP's negotiated max_send_wr */
    struct ibv_port_attr	 portinfo;
};

struct bw_dest {
    int lid;
    int qpn;
    int psn;
    union ibv_gid gid;
    /* Server side only: buffer address and rkey for the client's RDMA
     * WRITEs. Zero on the client (the server never touches client memory). */
    uint64_t buf_addr;
    uint32_t rkey;
};

void wire_gid_to_gid(const char *wgid, union ibv_gid *gid)
{
    char tmp[9];
    uint32_t v32;
    int i;

    for (tmp[8] = 0, i = 0; i < 4; ++i) {
        memcpy(tmp, wgid + i * 8, 8);
        sscanf(tmp, "%x", &v32);
        *(uint32_t *)(&gid->raw[i * 4]) = ntohl(v32);
    }
}

void gid_to_wire_gid(const union ibv_gid *gid, char wgid[])
{
    int i;

    for (i = 0; i < 4; ++i)
        sprintf(&wgid[i * 8], "%08x", htonl(*(uint32_t *)(gid->raw + i * 4)));
}

/* Loop until len bytes move or the stream ends: the handshake messages are
 * fixed-size, and a short read would break the parse. */
static int bw_read_full(int fd, void *buf, size_t len)
{
    size_t got = 0;

    while (got < len) {
        ssize_t n = read(fd, (char *) buf + got, len - got);
        if (n <= 0)
            return 0;
        got += n;
    }
    return 1;
}

static int bw_write_full(int fd, const void *buf, size_t len)
{
    size_t sent = 0;

    while (sent < len) {
        ssize_t n = write(fd, (const char *) buf + sent, len - sent);
        if (n <= 0)
            return 0;
        sent += n;
    }
    return 1;
}

static struct bw_dest *bw_parse_dest(const char *msg, int expect_addr)
{
    struct bw_dest *dest = calloc(1, sizeof *dest);
    char gid[33];
    int n;

    if (!dest)
        return NULL;

    /* The server's message carries all six fields; the client's carries the
     * first four (addr/rkey stay zero). The client expects the server's
     * addr/rkey — its RDMA WRITEs land there — so it requires all six; a
     * truncated server message must not pass with addr/rkey zero. */
    n = sscanf(msg, DEST_FMT_PARSE,
               &dest->lid, &dest->qpn, &dest->psn, gid,
               &dest->buf_addr, &dest->rkey);
    if (n < 4 || (expect_addr && n < 6)) {
        free(dest);
        return NULL;
    }

    wire_gid_to_gid(gid, &dest->gid);
    return dest;
}

static int bw_connect_qp(struct bw_context *ctx, int port, int my_psn,
                         enum ibv_mtu mtu,
                         struct bw_dest *dest, int sgid_idx)
{
    struct ibv_qp_attr attr = {
            .qp_state		= IBV_QPS_RTR,
            .path_mtu		= mtu,
            .dest_qp_num		= dest->qpn,
            .rq_psn			= dest->psn,
            .max_dest_rd_atomic	= 1,
            .min_rnr_timer		= 12,
            .ah_attr		= {
                    .is_global	= 0,
                    .dlid		= dest->lid,
                    .sl		= 0,
                    .src_path_bits	= 0,
                    .port_num	= port
            }
    };

    /* GRH addressing is used iff the remote advertised a nonzero GID and we
     * have a GID index of our own; a remote GID with no local index (-g on
     * one side only) therefore degrades to LID-based addressing — the course
     * fabric's normal mode — instead of failing RTR on sgid_index = -1. */
    if (dest->gid.global.interface_id && sgid_idx >= 0) {
        attr.ah_attr.is_global = 1;
        attr.ah_attr.grh.hop_limit = 1;
        attr.ah_attr.grh.dgid = dest->gid;
        attr.ah_attr.grh.sgid_index = sgid_idx;
    }
    if (ibv_modify_qp(ctx->qp, &attr,
            IBV_QP_STATE              |
            IBV_QP_AV                 |
            IBV_QP_PATH_MTU           |
            IBV_QP_DEST_QPN           |
            IBV_QP_RQ_PSN             |
            IBV_QP_MAX_DEST_RD_ATOMIC |
            IBV_QP_MIN_RNR_TIMER)) {
        fprintf(stderr, "Failed to modify QP to RTR\n");
        return 1;
    }

    attr.qp_state	    = IBV_QPS_RTS;
    attr.timeout	    = 14;
    attr.retry_cnt	    = 7;
    attr.rnr_retry	    = 7;
    attr.sq_psn	    = my_psn;
    attr.max_rd_atomic  = 1;
    if (ibv_modify_qp(ctx->qp, &attr,
            IBV_QP_STATE              |
            IBV_QP_TIMEOUT            |
            IBV_QP_RETRY_CNT          |
            IBV_QP_RNR_RETRY          |
            IBV_QP_SQ_PSN             |
            IBV_QP_MAX_QP_RD_ATOMIC)) {
        fprintf(stderr, "Failed to modify QP to RTS\n");
        return 1;
    }

    return 0;
}

static struct bw_dest *bw_exch_dest_client(const char *servername, int port,
                                           const struct bw_dest *my_dest)
{
    struct addrinfo *res, *t;
    struct addrinfo hints = {
            .ai_family   = AF_INET,
            .ai_socktype = SOCK_STREAM
    };
    char *service;
    char msg[DEST_MSG_LEN];
    int n;
    int sockfd = -1;
    struct bw_dest *rem_dest = NULL;
    char gid[33];

    if (asprintf(&service, "%d", port) < 0)
        return NULL;

    n = getaddrinfo(servername, service, &hints, &res);

    if (n < 0) {
        fprintf(stderr, "%s for %s:%d\n", gai_strerror(n), servername, port);
        free(service);
        return NULL;
    }

    for (t = res; t; t = t->ai_next) {
        sockfd = socket(t->ai_family, t->ai_socktype, t->ai_protocol);
        if (sockfd >= 0) {
            if (!connect(sockfd, t->ai_addr, t->ai_addrlen))
                break;
            close(sockfd);
            sockfd = -1;
        }
    }

    freeaddrinfo(res);
    free(service);

    if (sockfd < 0) {
        /* No server listening: fail silently — exit non-zero with nothing
           printed (T1 acceptance criterion). */
        return NULL;
    }

    gid_to_wire_gid(&my_dest->gid, gid);
    memset(msg, 0, sizeof msg);
    sprintf(msg, DEST_FMT, my_dest->lid, my_dest->qpn, my_dest->psn, gid);
    if (!bw_write_full(sockfd, msg, sizeof msg)) {
        fprintf(stderr, "Couldn't send local address\n");
        goto out;
    }

    if (!bw_read_full(sockfd, msg, sizeof msg)) {
        perror("client read");
        fprintf(stderr, "Couldn't read remote address\n");
        goto out;
    }

    /* The server keeps the socket open until we signal receipt, so this
     * must go out before we close. */
    if (!bw_write_full(sockfd, "ready", sizeof "ready")) {
        perror("client write");
        goto out;
    }

    rem_dest = bw_parse_dest(msg, 1);
    if (!rem_dest) {
        fprintf(stderr, "Couldn't parse remote address\n");
        goto out;
    }

out:
    close(sockfd);
    return rem_dest;
}

static struct bw_dest *bw_exch_dest_server(struct bw_context *ctx,
                                           int ib_port, enum ibv_mtu mtu,
                                           int port,
                                           const struct bw_dest *my_dest,
                                           int sgid_idx)
{
    struct addrinfo *res, *t;
    struct addrinfo hints = {
            .ai_flags    = AI_PASSIVE,
            .ai_family   = AF_INET,
            .ai_socktype = SOCK_STREAM
    };
    char *service;
    char msg[DEST_MSG_LEN];
    int n;
    int sockfd = -1, connfd;
    struct bw_dest *rem_dest = NULL;
    char gid[33];

    if (asprintf(&service, "%d", port) < 0)
        return NULL;

    n = getaddrinfo(NULL, service, &hints, &res);

    if (n < 0) {
        fprintf(stderr, "%s for port %d\n", gai_strerror(n), port);
        free(service);
        return NULL;
    }

    for (t = res; t; t = t->ai_next) {
        sockfd = socket(t->ai_family, t->ai_socktype, t->ai_protocol);
        if (sockfd >= 0) {
            n = 1;

            setsockopt(sockfd, SOL_SOCKET, SO_REUSEADDR, &n, sizeof n);

            if (!bind(sockfd, t->ai_addr, t->ai_addrlen))
                break;
            close(sockfd);
            sockfd = -1;
        }
    }

    freeaddrinfo(res);
    free(service);

    if (sockfd < 0) {
        fprintf(stderr, "Couldn't listen to port %d\n", port);
        return NULL;
    }

    listen(sockfd, 1);
    connfd = accept(sockfd, NULL, 0);
    close(sockfd);
    if (connfd < 0) {
        fprintf(stderr, "accept() failed\n");
        return NULL;
    }

    if (!bw_read_full(connfd, msg, sizeof msg)) {
        perror("server read");
        fprintf(stderr, "Couldn't read remote address\n");
        goto out;
    }

    rem_dest = bw_parse_dest(msg, 0);
    if (!rem_dest) {
        fprintf(stderr, "Couldn't parse remote address\n");
        goto out;
    }

    if (bw_connect_qp(ctx, ib_port, my_dest->psn, mtu, rem_dest, sgid_idx)) {
        fprintf(stderr, "Couldn't connect to remote QP\n");
        free(rem_dest);
        rem_dest = NULL;
        goto out;
    }

    /* Send our address plus the buffer addr/rkey the client needs for its
     * RDMA WRITEs. */
    gid_to_wire_gid(&my_dest->gid, gid);
    memset(msg, 0, sizeof msg);
    sprintf(msg, DEST_FMT_SERVER,
            my_dest->lid, my_dest->qpn, my_dest->psn, gid,
            my_dest->buf_addr, my_dest->rkey);
    if (!bw_write_full(connfd, msg, sizeof msg)) {
        fprintf(stderr, "Couldn't send local address\n");
        free(rem_dest);
        rem_dest = NULL;
        goto out;
    }

    /* Final beat: the client signals it has our address with "ready" and
     * closes. The template leaves this read unchecked; the message is
     * short, so check the count, not the message size. */
    {
        char ready[sizeof "ready"];

        if (!bw_read_full(connfd, ready, sizeof ready)) {
            perror("server read");
            free(rem_dest);
            rem_dest = NULL;
            goto out;
        }
    }

out:
    close(connfd);
    return rem_dest;
}

static struct bw_context *bw_init_ctx(struct ibv_device *ib_dev, int port,
                                      int window, int is_server)
{
    struct bw_context *ctx;
    struct ibv_device_attr dev_attr;
    uint32_t max_send_wr;
    uint32_t max_recv_wr;

    ctx = calloc(1, sizeof *ctx);
    if (!ctx)
        return NULL;

    ctx->buf = malloc(roundup(BUFFER_SIZE, page_size));
    if (!ctx->buf) {
        fprintf(stderr, "Couldn't allocate work buf.\n");
        return NULL;
    }

    memset(ctx->buf, 0x7b + is_server, BUFFER_SIZE);

    ctx->ctrl_buf = malloc(CTRL_MSG_LEN);
    if (!ctx->ctrl_buf) {
        fprintf(stderr, "Couldn't allocate control buf.\n");
        return NULL;
    }

    ctx->context = ibv_open_device(ib_dev);
    if (!ctx->context) {
        fprintf(stderr, "Couldn't get context for %s\n",
                ibv_get_device_name(ib_dev));
        return NULL;
    }

    /* The advertised per-QP WR limits: mlx4 caps the WQEs a QP may hold,
     * and a declaration above the device's max_qp_wr fails QP creation. */
    if (ibv_query_device(ctx->context, &dev_attr)) {
        fprintf(stderr, "Couldn't query device attributes\n");
        return NULL;
    }
    max_send_wr = window + QP_SLACK;
    max_recv_wr = CTRL_POOL_DEPTH;
    if (max_send_wr > (uint32_t) dev_attr.max_qp_wr)
        max_send_wr = dev_attr.max_qp_wr;
    if (max_recv_wr > (uint32_t) dev_attr.max_qp_wr)
        max_recv_wr = dev_attr.max_qp_wr;

    ctx->pd = ibv_alloc_pd(ctx->context);
    if (!ctx->pd) {
        fprintf(stderr, "Couldn't allocate PD\n");
        return NULL;
    }

    /* The server's buffer must accept remote writes (the client's RDMA
     * WRITEs land here); the client's is only read by its own HCA. */
    ctx->mr = ibv_reg_mr(ctx->pd, ctx->buf, BUFFER_SIZE,
                         IBV_ACCESS_LOCAL_WRITE |
                         (is_server ? IBV_ACCESS_REMOTE_WRITE : 0));
    if (!ctx->mr) {
        fprintf(stderr, "Couldn't register MR\n");
        return NULL;
    }

    ctx->ctrl_mr = ibv_reg_mr(ctx->pd, ctx->ctrl_buf, CTRL_MSG_LEN,
                              IBV_ACCESS_LOCAL_WRITE);
    if (!ctx->ctrl_mr) {
        fprintf(stderr, "Couldn't register control MR\n");
        return NULL;
    }

    ctx->cq = ibv_create_cq(ctx->context, max_send_wr + max_recv_wr,
                            NULL, NULL, 0);
    if (!ctx->cq) {
        fprintf(stderr, "Couldn't create CQ\n");
        return NULL;
    }

    {
        int try_inline;

        /* The inline declaration is stepped down until QP creation
         * succeeds: mlx4 rejects the QP when the declared max_inline_data
         * (plus WQE overhead) exceeds what the hardware accepts, and no
         * portable query exposes that ceiling on every stack. The value
         * the QP was actually created with is read back below; that
         * read-back is the runtime max_inline_data the data path uses. */
        for (try_inline = MAX_INLINE_DATA_DECLARE;; try_inline -= 64) {
            struct ibv_qp_init_attr attr = {
                    .send_cq = ctx->cq,
                    .recv_cq = ctx->cq,
                    .cap     = {
                            .max_send_wr  = max_send_wr,
                            .max_recv_wr  = max_recv_wr,
                            .max_send_sge = 1,
                            .max_recv_sge = 1,
                            .max_inline_data = try_inline
                    },
                    .qp_type = IBV_QPT_RC
            };

            ctx->qp = ibv_create_qp(ctx->pd, &attr);
            if (ctx->qp || try_inline <= 0)
                break;
        }
        if (!ctx->qp) {
            fprintf(stderr,
                    "Couldn't create QP (send_wr %u, recv_wr %u, inline %d): %s\n",
                    max_send_wr, max_recv_wr, try_inline, strerror(errno));
            return NULL;
        }
    }

    {
        /* The runtime max_inline_data: read back what the QP was created
         * with, since the driver may clamp the request. */
        struct ibv_qp_attr attr;
        struct ibv_qp_init_attr init_attr;

        if (ibv_query_qp(ctx->qp, &attr, IBV_QP_CAP, &init_attr)) {
            fprintf(stderr, "Couldn't query QP attributes\n");
            return NULL;
        }
        ctx->max_inline_data = init_attr.cap.max_inline_data;
        ctx->sq_depth = init_attr.cap.max_send_wr;
    }

    {
        struct ibv_qp_attr attr = {
                .qp_state        = IBV_QPS_INIT,
                .pkey_index      = 0,
                .port_num        = port,
                .qp_access_flags = IBV_ACCESS_REMOTE_READ |
                IBV_ACCESS_REMOTE_WRITE
        };

        if (ibv_modify_qp(ctx->qp, &attr,
                IBV_QP_STATE              |
                IBV_QP_PKEY_INDEX         |
                IBV_QP_PORT               |
                IBV_QP_ACCESS_FLAGS)) {
            fprintf(stderr, "Failed to modify QP to INIT\n");
            return NULL;
        }
    }

    return ctx;
}

/* Post the entire control receive pool — never refreshed: each control
 * message consumes one pre-posted receive, and 32 cover a full sweep
 * (ADR-0001, assignment item 3). Returns 0 when all are posted. */
static int bw_post_control_recvs(struct bw_context *ctx)
{
    struct ibv_sge list = {
            .addr	= (uint64_t) ctx->ctrl_buf,
            .length = CTRL_MSG_LEN,
            .lkey	= ctx->ctrl_mr->lkey
    };
    struct ibv_recv_wr wr = {
            .wr_id	    = BW_RECV_WRID,
            .sg_list    = &list,
            .num_sge    = 1,
            .next       = NULL
    };
    struct ibv_recv_wr *bad_wr;
    int i;

    for (i = 0; i < CTRL_POOL_DEPTH; ++i)
        if (ibv_post_recv(ctx->qp, &wr, &bad_wr))
            break;

    return i == CTRL_POOL_DEPTH ? 0 : 1;
}

/* Post one control SEND — the client's done or the server's ack — always
 * signaled so the sender consumes a completion. The message rides inline when
 * the QP's max_inline_data allows it (it always does in practice); the
 * fallback stages it in the registered control area. */
static int bw_post_ctrl_send(struct bw_context *ctx, uint64_t wrid,
                             const struct bw_ctrl_msg *msg)
{
    struct ibv_sge sge = {
            .addr	= (uintptr_t) msg,
            .length = sizeof *msg,
            .lkey	= 0
    };
    struct ibv_send_wr wr = {
            .wr_id	    = wrid,
            .opcode	    = IBV_WR_SEND,
            .send_flags = IBV_SEND_SIGNALED,
            .sg_list    = &sge,
            .num_sge    = 1,
            .next	    = NULL
    };
    struct ibv_send_wr *bad_wr;

    if (ctx->max_inline_data >= (uint32_t) sizeof *msg) {
        wr.send_flags |= IBV_SEND_INLINE;
    } else {
        /* Non-inline: the SEND is DMA-read from a registered buffer, so
         * the message is staged in the control area. */
        memcpy(ctx->ctrl_buf, msg, sizeof *msg);
        sge.addr = (uint64_t) ctx->ctrl_buf;
        sge.lkey = ctx->ctrl_mr->lkey;
    }

    if (ibv_post_send(ctx->qp, &wr, &bad_wr)) {
        fprintf(stderr, "Couldn't post control SEND\n");
        return 1;
    }
    return 0;
}

/* Classify one completion: good status and a wr_id whose bit is set in
 * `allowed`. Prints the error and returns 1 otherwise — the two poll
 * loops share this so their protocol-error reports cannot drift. */
static int bw_wc_bad(struct ibv_wc *wc, uint64_t allowed)
{
    if (wc->status != IBV_WC_SUCCESS) {
        fprintf(stderr, "Bad status %s (%d) for wr_id %llu\n",
                ibv_wc_status_str(wc->status), wc->status,
                (unsigned long long) wc->wr_id);
        return 1;
    }
    if (!(allowed & (1ull << wc->wr_id))) {
        fprintf(stderr, "Unexpected completion for wr_id %llu\n",
                (unsigned long long) wc->wr_id);
        return 1;
    }
    return 0;
}

/* Poll the shared CQ until a completion with wr_id `want` arrives.
 * Completions whose wr_id bit is set in `pass` are consumed and ignored —
 * the client passes its done-send and data completions through while
 * waiting for the ack receive. Nothing else may complete, so a bad status
 * or an unexpected wr_id is a protocol error, as is a wait past the
 * deadline. */
static int bw_poll_until(struct bw_context *ctx, uint64_t want,
                         uint64_t pass, struct ibv_wc *wc)
{
    struct timespec deadline;

    clock_gettime(CLOCK_MONOTONIC, &deadline);
    deadline.tv_sec += CTRL_POLL_TIMEOUT_SEC;

    for (;;) {
        struct timespec now;
        int ne = ibv_poll_cq(ctx->cq, 1, wc);

        if (ne < 0) {
            fprintf(stderr, "poll CQ failed %d\n", ne);
            return 1;
        }
        if (ne == 1) {
            if (bw_wc_bad(wc, pass | (1ull << want)))
                return 1;
            if (wc->wr_id == want)
                return 0;
            continue;
        }

        clock_gettime(CLOCK_MONOTONIC, &now);
        if (now.tv_sec > deadline.tv_sec ||
            (now.tv_sec == deadline.tv_sec &&
             now.tv_nsec >= deadline.tv_nsec)) {
            fprintf(stderr,
                    "Timed out after %d s waiting for wr_id %llu\n",
                    CTRL_POLL_TIMEOUT_SEC, (unsigned long long) want);
            return 1;
        }
    }
}

/* Wait for the next control message on the pre-posted control receive
 * pool and verify it: the fixed tag and the expected sequence counter.
 * `pass` is handed to bw_poll_until — the client passes its done-send
 * and data completions through while waiting for the ack. `t_stamp`, when
 * non-NULL, receives CLOCK_MONOTONIC at the completion — the client's t1
 * for this size. */
static int bw_recv_ctrl(struct bw_context *ctx, uint64_t pass,
                        uint32_t seq, const char *kind,
                        struct timespec *t_stamp)
{
    struct ibv_wc wc;
    struct bw_ctrl_msg msg;

    if (bw_poll_until(ctx, BW_RECV_WRID, pass, &wc))
        return 1;

    if (t_stamp)
        clock_gettime(CLOCK_MONOTONIC, t_stamp);

    msg = *(const struct bw_ctrl_msg *) ctx->ctrl_buf;
    if (msg.tag != BW_CTRL_TAG || msg.seq != seq) {
        fprintf(stderr, "%s mismatch: tag 0x%x seq %u, expected seq %u\n",
                kind, msg.tag, msg.seq, seq);
        return 1;
    }

    return 0;
}

/* The client's streaming data-path state for one size: the windowed
 * pipeline (ADR-0002). posted counts every WR of the size's stream
 * (warmup + timed) so the signal schedule can pick the K-th WRs;
 * outstanding is posted minus the WRs the refill has reclaimed — exactly
 * K per reclaimed CQE, because only K-th WRs are signaled and RC
 * completions are in-order; the warmup residual and the final list's
 * remainder are covered by the CQEs the ack wait consumes, never by the
 * refill. Scoped to one size: the ack wait consumes the remaining data
 * and done completions without touching the state, so it must not
 * survive into the next size. */
struct bw_data_state {
    uint64_t posted;
    uint64_t outstanding;
};

/* Refill-never-empty (ADR-0002): while the window is full, reclaim only
 * the CQEs that are ready — each data CQE accounts for exactly K WRs,
 * because only the K-th WR of the stream is signaled and RC completions
 * are in-order — then return immediately so the caller reposts; the SQ
 * never empties and the NIC never idles. The second loop condition is
 * the device-clamped corner: when the SQ was created shallower than
 * W + K (the max_qp_wr clamp in bw_init_ctx), it keeps room for the next
 * K-WR list. The final list's CQE is never reclaimed here: no list is
 * posted after it, so the refill cannot run again; that CQE stays in the
 * CQ for the ack wait to consume (it precedes the ack, ADR-0003). During
 * the data path only data WRITE completions may be pending here, so
 * anything else is a protocol error; a poll returning 0 only means the
 * last WQEs are still in flight, so the poll is retried. */
static int bw_refill(struct bw_context *ctx, uint64_t window, uint64_t k,
                     struct bw_data_state *st)
{
    while (st->outstanding >= window ||
           st->outstanding + k >= (uint64_t) ctx->sq_depth) {
        struct ibv_wc wc;
        int ne = ibv_poll_cq(ctx->cq, 1, &wc);

        if (ne < 0) {
            fprintf(stderr, "poll CQ failed %d\n", ne);
            return 1;
        }
        if (ne == 0)
            continue;

        if (bw_wc_bad(&wc, 1ull << BW_DATA_WRID))
            return 1;
        st->outstanding -= k;
    }
    return 0;
}

/* Post `n` RDMA WRITEs of `size` bytes into the server's registered
 * buffer, as a stream of K-WR linked lists, one per ibv_post_send (the
 * last list takes the remainder). Signal schedule: the K-th WR of the
 * size's stream (t % k == 0) and the stream's final WR — mid-stream
 * lists therefore yield one CQE per K WRs, while the warmup residual and
 * the final remainder are accounted exactly (in-order RC). Messages ≤
 * max_inline_data ride the WQE inline (IBV_SEND_INLINE); larger ones use
 * the registered buffer. `wrs`/`sges` are the caller's K-deep WR arrays,
 * reused for every list. `final` marks the call that posts the stream's
 * last list (the timed one). */
static int bw_post_writes(struct bw_context *ctx, const struct bw_dest *dest,
                          size_t size, uint64_t n, uint64_t window,
                          uint64_t k, struct ibv_send_wr *wrs,
                          struct ibv_sge *sges, struct bw_data_state *st,
                          int final)
{
    uint32_t inline_flag =
            size <= ctx->max_inline_data ? IBV_SEND_INLINE : 0;

    while (n > 0) {
        uint64_t chunk = n < k ? n : k;
        struct ibv_send_wr *bad_wr;
        uint64_t i;

        if (bw_refill(ctx, window, k, st))
            return 1;

        for (i = 0; i < chunk; ++i) {
            uint64_t t = st->posted + i + 1; /* this WR's position in the stream */
            uint32_t signal =
                    (t % k == 0) || (final && n == chunk && i == chunk - 1);

            sges[i] = (struct ibv_sge) {
                    .addr	= (uint64_t) ctx->buf,
                    .length = size,
                    .lkey	= ctx->mr->lkey
            };
            wrs[i] = (struct ibv_send_wr) {
                    .wr_id	    = BW_DATA_WRID,
                    .opcode	    = IBV_WR_RDMA_WRITE,
                    .send_flags = inline_flag |
                                  (signal ? IBV_SEND_SIGNALED : 0),
                    .sg_list    = &sges[i],
                    .num_sge    = 1,
                    .next	    = i + 1 < chunk ? &wrs[i + 1] : NULL
            };
            wrs[i].wr.rdma.remote_addr = dest->buf_addr;
            wrs[i].wr.rdma.rkey = dest->rkey;
        }

        if (ibv_post_send(ctx->qp, &wrs[0], &bad_wr)) {
            fprintf(stderr, "Couldn't post data WRITEs\n");
            return 1;
        }
        st->posted += chunk;
        st->outstanding += chunk;
        n -= chunk;
    }
    return 0;
}

/* Print one result line, byte-identical to ex1: the size, throughput in
 * auto-scaled units (bps → Gbps), and nothing else. */
static void bw_print_result(size_t size, uint64_t count, double elapsed)
{
    double bps = (double) size * (double) count * 8.0 / elapsed;

    if (bps < 1000.0)
        printf("%zu\t%.2f\t%s\n", size, bps, "bps");
    else if (bps < 1000000.0)
        printf("%zu\t%.2f\t%s\n", size, bps / 1000.0, "Kbps");
    else if (bps < 1000000000.0)
        printf("%zu\t%.2f\t%s\n", size, bps / 1000000.0, "Mbps");
    else
        printf("%zu\t%.2f\t%s\n", size, bps / 1000000000.0, "Gbps");
}

/* Client side of the full sweep: per size, the warmup batch of WRITEs
 * rides the windowed stream ahead of the timed batch — the clock starts
 * at the first timed post and stops at the ack-receive completion
 * (ADR-0003) — closed by the done SEND. The done needs one free SQ slot:
 * the refill leaves at most W - 1 + K ≤ sq_depth - 1 WRs outstanding
 * after the last list (K ≤ QP_SLACK), so it always fits. The ack wait
 * passes the data and done-send completions through; the 21 acks consume
 * 21 of the 32 pre-posted control receive pool, never refreshed.
 * count_override (-n) replaces the timed count of every size. */
static int bw_client_bench(struct bw_context *ctx, const struct bw_dest *dest,
                           uint64_t window, uint64_t k, uint64_t count_override)
{
    /* The K-deep WR arrays, reused for every linked list of the sweep. */
    struct ibv_send_wr *wrs;
    struct ibv_sge *sges;
    uint32_t seq;
    int rc = 1;

    wrs = calloc(k, sizeof *wrs);
    sges = calloc(k, sizeof *sges);
    if (!wrs || !sges) {
        fprintf(stderr, "Couldn't allocate data batch\n");
        goto out;
    }

    for (seq = 0; seq < SWEEP_SIZES; ++seq) {
        size_t size = (size_t) 1 << seq;
        uint64_t count = count_override ? count_override : MSG_COUNTS[seq];
        struct bw_ctrl_msg done = { .tag = BW_CTRL_TAG, .seq = seq };
        struct timespec t0, t1;
        double elapsed;
        struct bw_data_state st = { 0, 0 };

        if (bw_post_writes(ctx, dest, size, WARMUP_COUNTS[seq],
                           window, k, wrs, sges, &st, 0))
            goto out;

        clock_gettime(CLOCK_MONOTONIC, &t0);

        if (bw_post_writes(ctx, dest, size, count,
                           window, k, wrs, sges, &st, 1))
            goto out;

        if (bw_post_ctrl_send(ctx, BW_SEND_DONE_WRID, &done))
            goto out;

        if (bw_recv_ctrl(ctx,
                         (1ull << BW_SEND_DONE_WRID) | (1ull << BW_DATA_WRID),
                         seq, "Ack", &t1))
            goto out;

        elapsed = (double) (t1.tv_sec - t0.tv_sec) +
                  (double) (t1.tv_nsec - t0.tv_nsec) / 1e9;
        bw_print_result(size, count, elapsed);
    }

    rc = 0;
out:
    free(sges);
    free(wrs);
    return rc;
}

/* Server side: poll each done off the pre-posted control receive pool —
 * nothing is ever reposted — verify its sequence counter, and ack it back.
 * The ack's own send completion is consumed before the next done is
 * awaited: it is the guarantee the ack left the HCA. */
static int bw_server_ctrl_exchange(struct bw_context *ctx)
{
    uint32_t seq;

    for (seq = 0; seq < SWEEP_SIZES; ++seq) {
        struct bw_ctrl_msg ack = { .tag = BW_CTRL_TAG, .seq = seq };
        struct ibv_wc wc;

        if (bw_recv_ctrl(ctx, 0, seq, "Done", NULL))
            return 1;

        if (bw_post_ctrl_send(ctx, BW_SEND_ACK_WRID, &ack))
            return 1;

        if (bw_poll_until(ctx, BW_SEND_ACK_WRID, 0, &wc))
            return 1;
    }

    return 0;
}

static int bw_close_ctx(struct bw_context *ctx)
{
    if (ibv_destroy_qp(ctx->qp)) {
        fprintf(stderr, "Couldn't destroy QP\n");
        return 1;
    }

    if (ibv_destroy_cq(ctx->cq)) {
        fprintf(stderr, "Couldn't destroy CQ\n");
        return 1;
    }

    if (ibv_dereg_mr(ctx->ctrl_mr)) {
        fprintf(stderr, "Couldn't deregister control MR\n");
        return 1;
    }

    if (ibv_dereg_mr(ctx->mr)) {
        fprintf(stderr, "Couldn't deregister MR\n");
        return 1;
    }

    if (ibv_dealloc_pd(ctx->pd)) {
        fprintf(stderr, "Couldn't deallocate PD\n");
        return 1;
    }

    if (ibv_close_device(ctx->context)) {
        fprintf(stderr, "Couldn't release context\n");
        return 1;
    }

    free(ctx->ctrl_buf);
    free(ctx->buf);
    free(ctx);

    return 0;
}

static void usage(const char *argv0)
{
    printf("Usage:\n");
    printf("  %s            start a server and wait for connection\n", argv0);
    printf("  %s <host>     connect to server at <host>\n", argv0);
    printf("\n");
    printf("Options:\n");
    printf("  -p, --port=<port>      handshake port (default 18515)\n");
    printf("  -d, --ib-dev=<dev>     use IB device <dev> (default first device found)\n");
    printf("  -i, --ib-port=<port>   use port <port> of IB device (default 1)\n");
    printf("  -r, --window=<depth>   window depth W: refill reclaims once W data WRs\n");
    printf("                      are outstanding (default %d)\n", WINDOW_DEFAULT);
    printf("  -k, --signal-interval=<k>  signal every k-th data WR (default %d,\n",
           SIGNAL_INTERVAL_DEFAULT);
    printf("                      max min(window, %d))\n", QP_SLACK);
    printf("  -n, --count=<n>      override the timed-batch count of every size\n");
    printf("                      (smoke-test the protocol with tiny batches)\n");
    printf("  -g, --gid-idx=<index>  local port gid index (default: LID-based)\n");
}

int main(int argc, char *argv[])
{
    struct ibv_device      **dev_list;
    struct ibv_device       *ib_dev;
    struct bw_context       *ctx;
    struct bw_dest          my_dest;
    struct bw_dest         *rem_dest;
    char                    *ib_devname = NULL;
    char                    *servername = NULL;
    int                      port = 18515; /* matches usage() */
    int                      ib_port = 1;
    int                      window = WINDOW_DEFAULT;
    int                      k = SIGNAL_INTERVAL_DEFAULT;
    uint64_t                 count_override = 0;
    int                      gidx = -1;

    srand48(getpid() * time(NULL));

    while (1) {
        int c;

        static struct option long_options[] = {
                { .name = "port",     .has_arg = 1, .val = 'p' },
                { .name = "ib-dev",   .has_arg = 1, .val = 'd' },
                { .name = "ib-port",  .has_arg = 1, .val = 'i' },
                { .name = "window",   .has_arg = 1, .val = 'r' },
                { .name = "signal-interval", .has_arg = 1, .val = 'k' },
                { .name = "count",    .has_arg = 1, .val = 'n' },
                { .name = "gid-idx",  .has_arg = 1, .val = 'g' },
                { 0 }
        };

        c = getopt_long(argc, argv, "p:d:i:r:k:n:g:", long_options, NULL);
        if (c == -1)
            break;

        switch (c) {
        case 'p':
            port = strtol(optarg, NULL, 0);
            if (port < 0 || port > 65535) {
                usage(argv[0]);
                return 1;
            }
            break;

        case 'd':
            ib_devname = strdup(optarg);
            break;

        case 'i':
            ib_port = strtol(optarg, NULL, 0);
            if (ib_port < 0) {
                usage(argv[0]);
                return 1;
            }
            break;

        case 'r':
            window = strtol(optarg, NULL, 0);
            if (window <= 0) {
                usage(argv[0]);
                return 1;
            }
            break;

        case 'k':
            k = strtol(optarg, NULL, 0);
            if (k < 1) {
                usage(argv[0]);
                return 1;
            }
            break;

        case 'n':
            count_override = strtoull(optarg, NULL, 0);
            if (count_override < 1) {
                usage(argv[0]);
                return 1;
            }
            break;

        case 'g':
            gidx = strtol(optarg, NULL, 0);
            break;

        default:
            usage(argv[0]);
            return 1;
        }
    }

    if (optind == argc - 1)
        servername = strdup(argv[optind]);
    else if (optind < argc) {
        usage(argv[0]);
        return 1;
    }

    /* K is bounded by the window and the slack so the refill's guarantee
     * holds — after the last batch at most W - 1 + K ≤ sq_depth - 1 WRs
     * are outstanding, so the done SEND always finds a free SQ slot. */
    if (k > window || k > QP_SLACK) {
        usage(argv[0]);
        return 1;
    }

    page_size = sysconf(_SC_PAGESIZE);

    dev_list = ibv_get_device_list(NULL);
    if (!dev_list) {
        perror("Failed to get IB devices list");
        return 1;
    }

    if (!ib_devname) {
        ib_dev = *dev_list;
        if (!ib_dev) {
            fprintf(stderr, "No IB devices found\n");
            return 1;
        }
    } else {
        int i;
        for (i = 0; dev_list[i]; ++i)
            if (!strcmp(ibv_get_device_name(dev_list[i]), ib_devname))
                break;
        ib_dev = dev_list[i];
        if (!ib_dev) {
            fprintf(stderr, "IB device %s not found\n", ib_devname);
            return 1;
        }
    }

    ctx = bw_init_ctx(ib_dev, ib_port, window, !servername);
    if (!ctx)
        return 1;

    /* The whole control receive pool is posted before the handshake, so no
     * control message can ever find the RQ empty (ADR-0001). */
    if (bw_post_control_recvs(ctx)) {
        fprintf(stderr, "Couldn't post control receives\n");
        return 1;
    }

    if (ibv_query_port(ctx->context, ib_port, &ctx->portinfo)) {
        fprintf(stderr, "Couldn't get port info\n");
        return 1;
    }

    my_dest.lid = ctx->portinfo.lid;
    if (ctx->portinfo.link_layer == IBV_LINK_LAYER_INFINIBAND && !my_dest.lid) {
        fprintf(stderr, "Couldn't get local LID\n");
        return 1;
    }

    if (gidx >= 0) {
        if (ibv_query_gid(ctx->context, ib_port, gidx, &my_dest.gid)) {
            fprintf(stderr, "Could not get local gid for gid index %d\n", gidx);
            return 1;
        }
    } else
        memset(&my_dest.gid, 0, sizeof my_dest.gid);

    my_dest.qpn = ctx->qp->qp_num;
    my_dest.psn = lrand48() & 0xffffff;

    /* The path MTU comes from the port's active MTU, so large messages use
     * the largest packets the link allows. */
    if (servername)
        rem_dest = bw_exch_dest_client(servername, port, &my_dest);
    else {
        /* The server advertises its buffer — the client's RDMA WRITEs land
         * here — and nothing else beyond the template's QP address. */
        my_dest.buf_addr = (uint64_t) ctx->buf;
        my_dest.rkey = ctx->mr->rkey;
        rem_dest = bw_exch_dest_server(ctx, ib_port, ctx->portinfo.active_mtu,
                                       port, &my_dest, gidx);
    }

    if (!rem_dest)
        return 1;

    if (servername)
        if (bw_connect_qp(ctx, ib_port, my_dest.psn, ctx->portinfo.active_mtu,
                          rem_dest, gidx))
            return 1;

    /* The full sweep: the client streams the WRITEs of each size and
     * drives one done SEND per size, the server acks each. Both sides
     * verify every sequence counter. */
    if (servername) {
        if (bw_client_bench(ctx, rem_dest, (uint64_t) window, (uint64_t) k,
                            count_override))
            return 1;
    } else {
        if (bw_server_ctrl_exchange(ctx))
            return 1;
    }

    /* All 21 sizes complete; the 21 result lines were printed. */
    {
        int rc = bw_close_ctx(ctx);

        free(rem_dest);
        ibv_free_device_list(dev_list);
        return rc;
    }
}

  refill: `

    <rect x="20" y="42" width="180" height="166" rx="10" fill="#0d1b2e" stroke="#38bdf8"/>
    <text x="26" y="30" font-size="12" fill="#93c5fd">SQ — send queue (depth = W + QP_SLACK)</text>
    <g font-size="10" fill="#e0f2fe" text-anchor="middle">
      <rect x="38" y="60" width="17" height="128" rx="3" fill="#1e3a5f"/>
      <rect x="59" y="60" width="17" height="128" rx="3" fill="#1e3a5f"/>
      <rect x="80" y="60" width="17" height="128" rx="3" fill="#1e3a5f"/>
      <rect x="101" y="60" width="17" height="128" rx="3" fill="#38bdf8" opacity="0.9"/><text x="109" y="50" fill="#7dd3fc">K</text>
      <rect x="122" y="60" width="17" height="128" rx="3" fill="#1e3a5f"/>
      <rect x="143" y="60" width="17" height="128" rx="3" fill="#1e3a5f"/>
      <rect x="164" y="60" width="17" height="128" rx="3" fill="#38bdf8" opacity="0.9"/><text x="172" y="50" fill="#7dd3fc">K</text>
    </g>
    <path d="M38 206 L38 218 L122 218 L122 206" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="80" y="236" font-size="11" fill="#fbbf24" text-anchor="middle">window W — outstanding &lt; W</text>
    <line x1="200" y1="120" x2="322" y2="120" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="205" y="106" font-size="11" fill="#cbd5e1">RDMA WRITE — every K-th signaled</text>
    <rect x="330" y="96" width="140" height="48" rx="8" fill="#0d1b2e" stroke="#34d399"/>
    <text x="342" y="116" font-size="11" fill="#a7f3d0">server buffer</text>
    <text x="342" y="132" font-size="10" fill="#6ee7b7">addr + rkey (from bw_dest)</text>
    <line x1="400" y1="144" x2="400" y2="166" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="330" y="166" width="140" height="48" rx="8" fill="#0d1b2e" stroke="#f472b6"/>
    <text x="342" y="186" font-size="11" fill="#fbcfe8">CQ — completions</text>
    <text x="342" y="202" font-size="10" fill="#f9a8d4">one CQE per K WRs, in order</text>
    <path d="M330 190 H 262 V 68 H 200" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <text x="266" y="184" font-size="10" fill="#fbbf24">refill</text>
    <text x="206" y="58" font-size="10" fill="#fbbf24">reclaim K per CQE → repost</text>
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2e8f0"/></marker></defs>
  </svg>
  <figcaption>The windowed pipeline (ADR-0002): WRs stream into the SQ; only the K-th is signaled, so each CQE accounts for exactly K WRs; the refill reclaims just what's ready and the caller reposts — the SQ never empties.</figcaption>`
};

/* ---------- DOM refs ---------- */
const fileEl = document.getElementById("file-line");
const rail = document.getElementById("rail");
const bubbleB = document.getElementById("bubbleB");
const sheet = document.getElementById("sheet");
const tourA = document.getElementById("tourA");
const minimap = document.getElementById("minimap");
const stepperC = document.getElementById("stepperC");
const overlayC = document.getElementById("overlayC");
const beginBtn = document.getElementById("beginBtn");

/* ---------- render the file line ---------- */
const lineEls = [];           // line number -> element
const stOfLine = {};          // line number -> station id
const startsOf = {};          // station id -> start line
const lineCount = LINES.length;
STATIONS.forEach(s => {
  for (let l = s.lines[0]; l <= s.lines[1]; l++) stOfLine[l] = s.id;
  startsOf[s.id] = s.lines[0];
});
{
  const frag = document.createDocumentFragment();
  LINES.forEach((ln, idx) => {
    const div = document.createElement("div");
    div.className = "fl-line";
    div.dataset.line = idx + 1;
    const g = document.createElement("div");
    g.className = "fl-g"; g.textContent = idx + 1;
    const c = document.createElement("div");
    c.className = "fl-c";
    for (const t of ln.toks) {
      const s = document.createElement("span");
      s.className = "tk " + t.t; s.textContent = t.s;
      c.appendChild(s);
    }
    div.appendChild(g); div.appendChild(c);
    if (stOfLine[idx + 1] && startsOf[stOfLine[idx + 1]] === idx + 1) div.classList.add("st-start");
    lineEls[idx + 1] = div;
    frag.appendChild(div);
  });
  fileEl.appendChild(frag);
}

/* ---------- state ---------- */
const state = { variant: "A", open: null, cur: null, bubbleAnchor: null };
const VARIANTS = { A: "Rail", B: "Float", C: "Deck" };

/* ---------- block renderer (light-skeleton voice) ---------- */
function blockHTML(b) {
  switch (b.k) {
    case "lead": return `<p class="b-lead">${b.t}</p>`;
    case "p": return `<p>${b.t}</p>`;
    case "watch": return `<div class="b-watch">⚠ ${b.t}</div>`;
    case "predict":
      return `<div class="b-pred"><p class="q">Predict — ${b.q}</p>` +
        `<button class="rev">Reveal</button><p class="a hidden">${b.a}</p></div>`;
    case "xlink":
      return `<div class="b-x"><span>Cross-links</span>${b.refs.map(r => `<span class="xchip">${r}</span>`).join("")}</div>`;
    case "diagram": return `<figure class="b-diag">${DIAGRAMS[b.id]}</figure>`;
    default: return "";
  }
}
function stationHTML(id) {
  const s = STATIONS.find(x => x.id === id);
  const pos = ROUTE.indexOf(id);
  const typeLabel = s.type === "constant" ? "constant" : s.type;
  return `<div class="bubble">
    <h2>${s.title}</h2>
    <div class="b-sub"><span class="typ">${typeLabel}</span>` +
    s.tags.map(t => `<span class="tag">${t}</span>`).join("") +
    `<span style="margin-left:6px">${s.lines[0]}–${s.lines[1]}</span></div>
    ${s.blocks.map(blockHTML).join("")}
    <div class="b-nav">
      <button data-nav="prev">← ${pos > 0 ? SNAME[ROUTE[pos - 1]] : "…"}</button>
      <button data-nav="next">${pos < ROUTE.length - 1 ? SNAME[ROUTE[pos + 1]] : "Finish"} →</button>
    </div>
  </div>`;
}
function placeholderHTML() {
  return `<div class="b-placeholder">
    <h3>Click any line to explain it</h3>
    <p>Every line is owned by a station. Four sample stations are live; the rest of the file is owned by stations the partition ticket (#24) will cut.</p>
    <div class="slist">
      ${ROUTE.map((id, i) => {
        const s = STATIONS.find(x => x.id === id);
        return `<div class="sitem" data-open="${id}"><b>${i + 1}. ${s.title}</b>
          <div class="meta">${s.type} · lines ${s.lines[0]}–${s.lines[1]} · ${s.tags.join(" / ")}</div></div>`;
      }).join("")}
    </div>
  </div>`;
}

/* ---------- highlight updates ---------- */
function applyHighlights() {
  const { open, cur } = state;
  lineEls.forEach((el, l) => {
    el.classList.remove("st-open", "st-cur");
    const st = stOfLine[l];
    if (open && st === open) el.classList.add("st-open");
    if (cur && st === cur && st !== open) el.classList.add("st-cur");
  });
  if (state.variant === "B") {
    // spotlight: dim everything outside the open station
    fileEl.querySelectorAll(".fl-line").forEach(el => {
      el.classList.toggle("dim", !!open && !el.classList.contains("st-open"));
    });
  }
}
function setPreviewLine(l) {
  lineEls.forEach((el, n) => el.classList.toggle("st-preview", n === l));
}

/* ---------- scrollspy ---------- */
function spy() {
  const rect = fileEl.getBoundingClientRect();
  const el = document.elementFromPoint(rect.left + 24, rect.top + rect.height / 2);
  const lineEl = el ? el.closest(".fl-line") : null;
  const n = lineEl ? +lineEl.dataset.line : null;
  const st = n ? stOfLine[n] : null;
  if (st !== state.cur) { state.cur = st; applyHighlights(); paintTour(); }
}
let spyTimer = null;
fileEl.addEventListener("scroll", () => {
  if (spyTimer) return;
  spyTimer = requestAnimationFrame(() => { spyTimer = null; spy(); });
});

/* ---------- open / close ---------- */
function openStation(id, opts = {}) {
  const s = STATIONS.find(x => x.id === id);
  state.open = id; state.cur = id;
  applyHighlights(); paintTour();
  if (!opts.noScroll) {
    fileEl.scrollTop = lineEls[s.lines[0]].offsetTop - Math.min(120, fileEl.clientHeight / 3);
  }
  if (state.variant === "A") {
    rail.innerHTML = stationHTML(id);
  } else if (state.variant === "B") {
    showBubbleB(id);
  } else {
    sheet.innerHTML = stationHTML(id);
    sheet.classList.add("open");
  }
  if (opts.fromClick && state.variant === "B") {
    state.bubbleAnchor = opts.lineEl;
  }
}
function closeStation() {
  state.open = null;
  applyHighlights(); paintTour();
  if (state.variant === "A") rail.innerHTML = placeholderHTML();
  else if (state.variant === "B") bubbleB.style.display = "none";
  else sheet.classList.remove("open");
}
function showBubbleB(id) {
  const html = stationHTML(id);
  bubbleB.innerHTML = html;
  bubbleB.style.display = "block";
  if (state.bubbleAnchor) {
    const r = state.bubbleAnchor.getBoundingClientRect();
    const x = Math.min(r.right + 14, window.innerWidth - 372);
    const y = Math.max(12, Math.min(r.top - 40, window.innerHeight - Math.min(320, bubbleB.offsetHeight) - 20));
    bubbleB.style.left = x + "px"; bubbleB.style.top = y + "px";
  } else {
    bubbleB.style.left = "calc(100% - 380px)"; bubbleB.style.top = "90px";
  }
}

/* ---------- click anywhere to explain ---------- */
fileEl.addEventListener("mouseover", e => {
  const l = e.target.closest(".fl-line");
  setPreviewLine(l ? +l.dataset.line : null);
});
fileEl.addEventListener("mouseout", () => setPreviewLine(null));
fileEl.addEventListener("click", e => {
  const l = e.target.closest(".fl-line");
  if (!l) return;
  const n = +l.dataset.line;
  const st = stOfLine[n];
  if (!st) {
    if (state.variant === "A") { rail.innerHTML = `<div class="b-placeholder"><h3>Line ${n}</h3><p>No sample station owns this line yet — the partition ticket (#24) cuts them.</p></div>`; }
    else if (state.variant === "B") { /* tiny inline note */ l.classList.add("st-preview"); }
    else { sheet.innerHTML = `<div class="bubble"><h2>Line ${n}</h2><p>No sample station owns this line yet — the partition ticket (#24) cuts them.</p></div>`; sheet.classList.add("open"); }
    return;
  }
  state.bubbleAnchor = l;
  openStation(st, { fromClick: true, lineEl: l, noScroll: true });
});

/* ---------- tour line painters ---------- */
function paintTour() {
  if (state.variant === "A") paintTourA();
  else if (state.variant === "B") paintMinimap();
  else paintStepper();
}
function paintTourA() {
  const cur = state.cur || state.open;
  const pos = cur ? ROUTE.indexOf(cur) : -1;
  const next = pos >= 0 && pos < ROUTE.length - 1 ? ROUTE[pos + 1] : null;
  tourA.innerHTML = `<button id="startBtn">▶ Start tour</button>` +
    ROUTE.map((id, i) => {
      const s = STATIONS.find(x => x.id === id);
      const on = state.open === id ? " on" : "";
      const isCur = cur === id && !on ? " cur" : "";
      return `<button class="chip${on}${isCur}" data-open="${id}" title="lines ${s.lines[0]}–${s.lines[1]}"><span class="no">${i + 1}</span>${s.title}</button>`;
    }).join("") +
    `<span id="nextHint">next: <b>${next ? SNAME[next] : "—"}</b></span>`;
}
function paintMinimap() {
  const cur = state.cur || state.open;
  const track = minimap.querySelector(".track");
  const existing = track.querySelectorAll(".tick");
  if (existing.length !== ROUTE.length) {
    track.innerHTML = ROUTE.map(id => `<div class="tick s${ROUTE.indexOf(id) + 1}" data-open="${id}" title="${STATIONS.find(x => x.id === id).title} (lines ${STATIONS.find(x => x.id === id).lines[0]}–${STATIONS.find(x => x.id === id).lines[1]})"></div>`).join("");
  }
  track.querySelectorAll(".tick").forEach(t => {
    const id = t.dataset.open;
    const s = STATIONS.find(x => x.id === id);
    const mid = (s.lines[0] + s.lines[1]) / 2;
    t.style.top = ((mid / lineCount) * 100) + "%";
    t.classList.toggle("cur", cur === id);
  });
}
function paintStepper() {
  const cur = state.cur || state.open;
  const pos = cur ? ROUTE.indexOf(cur) : -1;
  stepperC.innerHTML = ROUTE.map((id, i) => {
    const s = STATIONS.find(x => x.id === id);
    const on = state.open === id ? " on" : "";
    const done = i < pos ? " done" : "";
    return `<div class="step${on}${done}" data-open="${id}" title="lines ${s.lines[0]}–${s.lines[1]}">
      <span class="dot">${i + 1}</span><span class="lab">${s.title}</span>` +
      (i < ROUTE.length - 1 ? `<span class="conn"></span>` : "") + `</div>`;
  }).join("");
}

/* ---------- tour navigation ---------- */
document.addEventListener("click", e => {
  const openBtn = e.target.closest("[data-open]");
  if (openBtn) { openStation(openBtn.dataset.open); return; }
  if (e.target.closest("#startBtn") || e.target.closest("#beginBtn")) { openStation(ROUTE[0]); return; }
  if (e.target.closest("#startTourOverlay")) { overlayC.classList.add("hidden"); openStation(ROUTE[0]); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    const cur = state.open ? ROUTE.indexOf(state.open) : -1;
    const d = nav.dataset.nav === "next" ? 1 : -1;
    const npos = Math.min(ROUTE.length - 1, Math.max(0, cur + d));
    openStation(ROUTE[npos]);
  }
  if (e.target.closest(".rev")) {
    e.target.closest(".b-pred").querySelector(".a").classList.remove("hidden");
    e.target.style.display = "none";
  }
  if (e.target.closest("#closeBubble")) closeStation();
  if (state.variant === "B" && state.open && !e.target.closest("#bubbleB") &&
      !e.target.closest("#file-line") && !e.target.closest("#minimap") &&
      !e.target.closest("#beginBtn") && !e.target.closest("#switcher")) {
    closeStation();
  }
});

/* ---------- entry feel ---------- */
beginBtn.addEventListener("click", () => openStation(ROUTE[0]));
overlayC.innerHTML = `<div class="oc-card">
  <h1>bw.c — guided tour</h1>
  <p class="pitch">A two-line tour of the Verbs throughput benchmark: the <b>file line</b> (code order — the spatial map) and the <b>tour line</b> below (the route). Walk the sample to feel the shell: click any line to explain it, watch the highlight follow you.</p>
  <ul>
    ${ROUTE.map((id, i) => {
      const s = STATIONS.find(x => x.id === id);
      return `<li><span class="no">${i + 1}</span> ${s.title}<span class="meta">${s.type} · ${s.lines[0]}–${s.lines[1]}</span></li>`;
    }).join("")}
  </ul>
  <button id="startTourOverlay">Start the tour</button>
</div>`;

/* ---------- variant switcher ---------- */
function setVariant(v, preserveState = true) {
  v = VARIANTS[v] ? v : "A";
  state.variant = v;
  document.body.dataset.variant = v;
  document.getElementById("vKey").textContent = v;
  document.getElementById("vName").textContent = VARIANTS[v];
  if (v === "A") rail.innerHTML = state.open ? stationHTML(state.open) : placeholderHTML();
  if (v === "B") { if (state.open) showBubbleB(state.open); else bubbleB.style.display = "none"; }
  if (v === "C") { sheet.innerHTML = state.open ? stationHTML(state.open) : ""; sheet.classList.toggle("open", !!state.open); }
  overlayC.classList.toggle("hidden", v !== "C");
  paintTour(); applyHighlights();
  if (!preserveState) { state.open = null; closeStation(); }
}
function cycle(dir) {
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(state.variant);
  const next = keys[(i + dir + keys.length) % keys.length];
  setVariant(next);
  history.replaceState(null, "", "?variant=" + next);
}
document.getElementById("prevV").addEventListener("click", () => cycle(-1));
document.getElementById("nextV").addEventListener("click", () => cycle(1));
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    cycle(e.key === "ArrowRight" ? 1 : -1);
  }
});

/* ---------- bootstrap ---------- */
{
  const want = new URLSearchParams(location.search).get("variant") || "A";
  state.variant = want; document.body.dataset.variant = want;
  document.getElementById("vKey").textContent = want;
  document.getElementById("vName").textContent = VARIANTS[want];
  rail.innerHTML = placeholderHTML();
  paintMinimap();
  paintStepper();
  spy();
}
</script>
</body>
</html>
