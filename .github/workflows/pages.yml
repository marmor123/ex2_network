# Deploys the teaching site to GitHub Pages: the current site
# (prototype/app-shell/) stays at the root, the guided tour
# (docs/tour/site/) gets its own /tour/ path. The job assembles a
# combined folder and uploads it — both sites remain static and no-build.
# Runs on every push to main; the workflow file itself also stays on main.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the combined site folder
        run: |
          mkdir -p _site/tour
          cp -r prototype/app-shell/* _site/
          cp -r docs/tour/site/* _site/tour/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
