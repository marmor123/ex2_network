# Deploys the teaching app (prototype/app-shell/) to GitHub Pages.
# Site root = the app folder, so the URL is clean: https://marmor123.github.io/ex2_network/
# Runs on every push to main; the workflow file itself also stays on main.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/app-shell
      - id: deployment
        uses: actions/deploy-pages@v4
